write:
  target:
    device:
      integration: gicisky
  fields:
    payload:
      required: true
      example: |
        - type: text
          value: Hello World!
          x: 10
          y: 10
          size: 40
      default:
        - type: text
          value: Hello World!
          x: 10
          y: 10
          size: 40
      selector:
        object:
    rotate:
      required: false
      example: '0'
      selector:
        number:
          min: 0
          max: 270
          step: 90
    background:
      required: false
      example: white
      selector:
        select:
          options:
            - "white"
            - "black"
            - "red"
            - "yellow"
    dither:
      required: false
      example: none
      selector:
        select:
          mode: dropdown
          options:
            - "none"
            - "floyd"
            - "atkinson"
            - "jarvis"
            - "stucki"
            - "burkes"
            - "sierra"
            - "sierra2"
            - "sierra-lite"
            - "stevenson-arce"
            - "bayer2"
            - "bayer4"
            - "bayer8"
            - "bayer16"
            - "clustered4"
            - "clustered8"
    dry_run:
      required: false
      example: 'false'
      selector:
        boolean:
